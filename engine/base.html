<!doctype html><html><head><meta charset="utf-8"><style>
:root{--a:__ACCENT__;--a16:color-mix(in srgb,var(--a) 16%,transparent);--a60:color-mix(in srgb,var(--a) 60%,transparent)}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1080px;height:1920px;overflow:hidden;background:#0b0a0d;font-family:Inter,sans-serif;color:#fff}
#bg{position:absolute;inset:0;background:radial-gradient(circle at 50% 38%,color-mix(in srgb,var(--a) 24%,#0b0a0d) 0%,color-mix(in srgb,var(--a) 8%,#0b0a0d) 45%,#09080a 100%)}
#dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 2px,transparent 2px);background-size:44px 44px}
.orb{position:absolute;width:620px;height:620px;border-radius:50%;filter:blur(120px);opacity:.32}
.abs{position:absolute;left:0;top:0;will-change:transform}
.chip{position:absolute;left:60px;top:84px;display:flex;gap:18px;align-items:center}
.pill{background:var(--a16);border:2px solid var(--a60);color:var(--a);border-radius:40px;padding:12px 24px;font-weight:800;font-size:28px;letter-spacing:2px;white-space:nowrap}
#step{font-weight:700;font-size:34px;color:#fff;white-space:nowrap}
#pdots{position:absolute;right:60px;top:100px;display:flex;gap:12px}
#pdots i{width:14px;height:14px;border-radius:7px;background:rgba(255,255,255,.22);display:block}
#bar{position:absolute;left:60px;top:1856px;width:960px;height:6px;border-radius:3px;background:rgba(255,255,255,.12)}
#barf{height:100%;border-radius:3px;background:var(--a);width:0}
#cap{position:absolute;left:40px;right:40px;top:1655px;transform:translateY(-50%);text-align:center;font-weight:800;font-size:66px;line-height:1.15}
#cap span{display:inline-block;margin:0 10px}
.node{width:170px;height:170px;border-radius:36px;background:rgba(255,255,255,.06);border:3px solid rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center}
.node svg{width:92px;height:92px}
.lbl{font-weight:700;font-size:32px;text-align:center;white-space:nowrap;color:#ddd}
.card{background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.16);border-radius:28px;padding:22px 30px;font-weight:700;font-size:34px;white-space:nowrap}
.card.on{border-color:var(--a)}
.dim{color:#aaa;font-size:24px;letter-spacing:2px}
.acc{color:var(--a)}
.tok{background:var(--a);color:#120a04;border-radius:22px;padding:12px 22px;font-weight:800;font-size:32px;white-space:nowrap;box-shadow:0 0 40px var(--a60)}
.phone{width:380px;height:760px;border-radius:60px;background:#141217;border:6px solid #3a3540;overflow:hidden;position:relative}
.mono{font-family:'DejaVu Sans Mono',monospace}
.big{font-size:76px;font-weight:900;text-align:center;white-space:nowrap}
svg.edges{position:absolute;left:0;top:0}
</style></head><body>
<div id="bg"></div><div id="dots"></div>
<div class="orb" id="o1" style="background:var(--a)"></div><div class="orb" id="o2" style="background:color-mix(in srgb,var(--a) 50%,#ff2f6d)"></div>
<svg class="edges" id="E" width="1080" height="1920"></svg>
<div id="stage"></div>
<div class="chip"><div class="pill">● HOW IT WORKS</div><div id="step"></div></div>
<div id="pdots"></div><div id="cap"></div><div id="bar"><div id="barf"></div></div>
<script>
const TL=__TL__;const ACC='__ACCENT__';
const sv=(b,c='#fff')=>`<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${b}</svg>`;
const IC={
phone:'<rect x="6" y="2" width="12" height="20" rx="3"/><path d="M11 18h2"/>',
server:'<rect x="3" y="3" width="18" height="7" rx="2"/><rect x="3" y="14" width="18" height="7" rx="2"/><path d="M7 6.5h.01M7 17.5h.01M11 6.5h6M11 17.5h6"/>',
gate:'<circle cx="12" cy="12" r="3"/><path d="M3 12h6M15 12h6M17 8l4 4-4 4M12 3v6M12 15v6"/>',
tower:'<path d="M12 9l-4 13M12 9l4 13M9.5 16h5"/><circle cx="12" cy="7" r="1.6"/><path d="M8 3.5a6 6 0 000 7M16 3.5a6 6 0 010 7M5.5 1.5a9 9 0 000 11M18.5 1.5a9 9 0 010 11"/>',
db:'<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>',
bank:'<path d="M3 10l9-6 9 6M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 21h18"/>',
car:'<path d="M3 16v-4l2-5h14l2 5v4z"/><circle cx="7" cy="16.5" r="2"/><circle cx="17" cy="16.5" r="2"/><path d="M5 12h14"/>',
cam:'<rect x="3" y="7" width="18" height="13" rx="2"/><circle cx="12" cy="13.5" r="3.5"/><path d="M8 7l2-3h4l2 3"/>',
user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>',
store:'<path d="M4 10v10h16V10M3 10l2-6h14l2 6zM9 20v-5h6v5"/>',
bike:'<circle cx="6" cy="17" r="3"/><circle cx="18" cy="17" r="3"/><path d="M6 17l4-7h5l3 7M13 10l-2-4H8"/>',
clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
chip:'<rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/>',
mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/>',
ear:'<path d="M7 9a5 5 0 0110 0c0 3-3 4-3 7a3 3 0 01-6 0"/><path d="M10 9a2 2 0 014 0"/>',
speaker:'<path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9a4 4 0 010 6M19 6a8 8 0 010 12"/>',
finger:'<path d="M12 4a7 7 0 017 7v2M5 11a7 7 0 013-5.7M8 20c1-2 1-5 1-9a3 3 0 016 0c0 3 0 6-1 9M12 11c0 4 0 7-2 10M16.5 15c-.2 2-.6 4-1.3 6"/>',
lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/>',
chart:'<path d="M3 20h18M6 16v-5M11 16V8M16 16v-3M20 16V5"/>',
pin:'<path d="M12 21s-7-6.5-7-12a7 7 0 0114 0c0 5.5-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/>',
sat:'<rect x="9" y="9" width="6" height="6" rx="1"/><path d="M3 5l4 4M17 15l4 4M2 9l5-5 3 3-5 5zM14 17l5-5 3 3-5 5z"/>',
wave:'<path d="M2 12c2-5 4-5 6 0s4 5 6 0 4-5 6 0"/>',
heart:'<path d="M12 20s-8-5-8-11a4.5 4.5 0 018-2.5A4.5 4.5 0 0120 9c0 6-8 11-8 11z"/>',
food:'<path d="M4 11h16a8 8 0 01-16 0zM12 3v4M8 5v2M16 5v2"/>',
play:'<rect x="5" y="2" width="14" height="20" rx="3"/><path d="M10 9l5 3-5 3z"/>',
brain:'<path d="M9 4a3 3 0 00-3 3 3 3 0 00-2 5 3 3 0 002 5 3 3 0 006 1V5a3 3 0 00-3-1zM15 4a3 3 0 013 3 3 3 0 012 5 3 3 0 01-2 5 3 3 0 01-6 1"/>',
bolt:'<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',
grid:'<path d="M3 3h18v18H3zM3 9h18M3 15h18M9 3v18M15 3v18"/>',
};
const icon=(k,c)=>sv(IC[k]||k,c);
const $=id=>document.getElementById(id),ST=$('stage');
function mk(html,cls){const d=document.createElement('div');d.className='abs '+(cls||'');d.innerHTML=html;ST.appendChild(d);d.style.visibility='hidden';ALL.push(d);return d}
const ALL=[];
function node(ic,label,sz=170){return mk(`<div class="node" style="width:${sz}px;height:${sz}px">${icon(ic)}</div>${label?`<div class="lbl" style="margin-top:14px">${label}</div>`:''}`)}
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),p=(t,a,b)=>clamp((t-a)/(b-a));
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,eob=x=>{const c=1.70158,c3=c+1;return 1+c3*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const kf=(t,k)=>{if(t<=k[0][0])return k[0][1];for(let i=1;i<k.length;i++)if(t<=k[i][0]){const u=eio((t-k[i-1][0])/(k[i][0]-k[i-1][0]));return k[i-1][1]+(k[i][1]-k[i-1][1])*u}return k[k.length-1][1]};
const pop=(t,t0,d=.45)=>t<t0?0:eob(clamp((t-t0)/d));
const win=(t,a,b,f=.35)=>Math.min(p(t,a,a+f),1-p(t,b-f,b));
function place(el,x,y,s=1,o=1,r=0){if(o<=0.001||s<=0.001){el.style.visibility='hidden';return}el.style.visibility='visible';el.style.opacity=o;el.style.transform=`translate(${x}px,${y}px) translate(-50%,-50%) scale(${s}) rotate(${r}deg)`}
const SC={};TL.scenes.forEach(s=>SC[s.name]=s);
const S0=n=>SC[n].start,S1=n=>{const i=TL.scenes.findIndex(s=>s.name==n);return i<TL.scenes.length-1?TL.scenes[i+1].start:59};
const norm=s=>s.toLowerCase().replace(/[^a-z0-9']/g,'');
function W(sc,w,n=0){const ws=TL.words.filter(x=>x.scene==sc&&norm(x.w).startsWith(w));if(!ws.length)throw Error('word '+sc+':'+w);return ws[Math.min(n,ws.length-1)].s}
function lerpPath(pts,u){const L=[];let tot=0;for(let i=1;i<pts.length;i++){const l=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);L.push(l);tot+=l}let d=clamp(u)*tot;for(let i=0;i<L.length;i++){if(d<=L[i]||i==L.length-1){const f=L[i]?clamp(d/L[i]):0;return[pts[i][0]+(pts[i+1][0]-pts[i][0])*f,pts[i][1]+(pts[i+1][1]-pts[i][1])*f]}d-=L[i]}}
const E=$('E'),EDGES=[];function edge(pts){const pl=document.createElementNS('http://www.w3.org/2000/svg','polyline');pl.setAttribute('fill','none');pl.setAttribute('stroke-width','6');pl.setAttribute('stroke-linecap','round');pl.setAttribute('stroke-dasharray','14 14');E.appendChild(pl);let tot=0;for(let i=1;i<pts.length;i++)tot+=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);const e={pl,tot,pts};EDGES.push(e);return e}
function drawEdge(e,t,t0,o,act){const u=eio(p(t,t0,t0+.6));if(o<=0||u<=0){e.pl.style.opacity=0;return}e.pl.style.opacity=o;e.pl.setAttribute('stroke-dashoffset',-t*40*(act?1:0));e.pl.setAttribute('stroke',act?ACC:'rgba(255,255,255,.3)');e.pl.style.filter=act?`drop-shadow(0 0 10px ${ACC})`:'';
 const n=[e.pts[0]];let need=u*e.tot;for(let i=1;i<e.pts.length;i++){const l=Math.hypot(e.pts[i][0]-e.pts[i-1][0],e.pts[i][1]-e.pts[i-1][1]);if(need>=l){n.push(e.pts[i]);need-=l}else{const f=need/l;n.push([e.pts[i-1][0]+(e.pts[i][0]-e.pts[i-1][0])*f,e.pts[i-1][1]+(e.pts[i][1]-e.pts[i-1][1])*f]);break}}e.pl.setAttribute('points',n.map(q=>q.join(',')).join(' '))}
const glow=(el,on)=>{const n=el.querySelector('.node')||el.firstElementChild;if(n){n.style.borderColor=on?ACC:'rgba(255,255,255,.18)';n.style.boxShadow=on?`0 0 50px color-mix(in srgb,${ACC} 55%,transparent)`:'none';n.style.background=on?`color-mix(in srgb,${ACC} 14%,transparent)`:'rgba(255,255,255,.06)'}};
const SFX=[];const cue=(t,n)=>SFX.push([+t.toFixed(3),n]);
const SCENES={};const SCN=(n,f)=>SCENES[n]=t=>f(t,win(t,S0(n)-.35,S1(n)));
TL.scenes.forEach(()=>$('pdots').appendChild(document.createElement('i')));
const CH=[];{let cur=[];TL.words.forEach((w,i)=>{cur.push(i);const L=cur.map(j=>TL.words[j].w).join(' ').length;const nx=TL.words[i+1];if(/[,.?!:]$/.test(w.w)||cur.length>=4||!nx||nx.scene!=w.scene||(L+1+(nx?nx.w.length:0))>18){CH.push(cur);cur=[]}})}
// outro helper: recap row of icons + two lines + follow pill
function outro(icons,l1,l2){const n=icons.length,gap=Math.min(215,860/(n-1));const ns=icons.map(([i,l])=>mk(`<div class="node" style="width:150px;height:150px">${icon(i)}</div><div class="lbl" style="margin-top:10px;font-size:26px">${l}</div>`));
 const x0=540-gap*(n-1)/2,e=edge([[x0,560],[x0+gap*(n-1),560]]);const L1=mk(`<div class="big">${l1}</div>`),L2=mk(`<div class="big acc">${l2}</div>`);
 const F=mk('<div style="text-align:center"><div class="tok" style="font-size:42px;display:inline-block;padding:20px 40px">Follow for more →</div><div style="margin-top:22px;font-size:34px;font-weight:700;color:#ddd">@the_working_behind</div></div>');
 const sc=TL.scenes[TL.scenes.length-1].name;const ta=TL.words.find(w=>w.scene==sc).s,tf=W(sc,'follow');const tl=TL.words.filter(w=>w.scene==sc&&/[.!?]$/.test(w.w))[0].e;
 cue(ta,'pop');cue(tf,'shimmer');
 SCENES[sc]=t=>{const o=p(t,S0(sc)-.2,S0(sc)+.1);ns.forEach((m,i)=>{place(m,x0+i*gap,560,pop(t,ta+i*.3),o);const nd=m.firstElementChild,lit=t>ta+i*.3+.2;nd.style.borderColor=lit?ACC:'rgba(255,255,255,.18)';nd.style.boxShadow=lit?`0 0 40px color-mix(in srgb,${ACC} 50%,transparent)`:'none'});
 drawEdge(e,t,ta,o*.8,t>ta);place(L1,540,900,pop(t,tl),o);place(L2,540,1010,pop(t,tl+.4),o);place(F,540,1260,pop(t,tf),o)}}
</script>
<script>
__SCENE__
</script>
<script>
window.SFX=SFX;
function render(t){
 $('o1').style.transform=`translate(${-150+Math.sin(t*.3)*120}px,${200+Math.cos(t*.23)*140}px)`;$('o2').style.transform=`translate(${600+Math.cos(t*.27)*120}px,${1100+Math.sin(t*.31)*160}px)`;
 let si=0;TL.scenes.forEach((s,i)=>{if(t>=s.start-.3)si=i});const sc=TL.scenes[si];
 $('step').textContent=sc.step;$('step').style.opacity=clamp((t-sc.start+.3)/.3);
 [...$('pdots').children].forEach((d,i)=>{d.style.background=i<=si?ACC:'rgba(255,255,255,.22)';d.style.width=i==si?'34px':'14px'});
 $('barf').style.width=(t/59*100)+'%';
 let ci=-1;CH.forEach((c,i)=>{if(t>=TL.words[c[0]].s-.05)ci=i});const cap=$('cap');
 if(ci>=0&&t<TL.words[CH[ci][CH[ci].length-1]].e+.6){cap.innerHTML=CH[ci].map(j=>{const w=TL.words[j];const last=j==CH[ci][CH[ci].length-1];const cur=t>=w.s&&(t<w.e||last);const done=t>=w.e;const s=1+.12*(1-p(t,w.s,w.s+.18))*(t>=w.s?1:0);return `<span style="color:${cur?ACC:done?'#fff':'rgba(255,255,255,.55)'};transform:scale(${s.toFixed(3)})">${w.w}</span>`}).join('')}else cap.innerHTML='';
 ALL.forEach(d=>d.style.visibility='hidden');EDGES.forEach(e=>e.pl.style.opacity=0);
 TL.scenes.forEach(s=>{const a=s.start-.5,b=S1(s.name)+.1;if(t>=a&&t<=b&&SCENES[s.name])SCENES[s.name](t)});
 SCENES.__bg&&SCENES.__bg(t);
}
window.render=render;
</script></body></html>
